<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velco — Local-First Context-Bound AI Workstation</title>
    <meta name="description" content="Velco is a local-first context-bound AI workstation. Capture first, bring your own AI. 100% private and offline." />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        // Disable default browser context menu to feel like a native desktop app
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });

        // Disable standard web shortcuts (F5, Ctrl+R reload, Ctrl+P print, Ctrl+U view-source)
        window.addEventListener('keydown', function (e) {
          if (
            e.key === 'F5' ||
            ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R' || e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U'))
          ) {
            e.preventDefault();
          }
        });

        try {
          const raw = localStorage.getItem('velco_settings_v1') || localStorage.getItem('lifeinbox_settings_v1');
          const theme = raw ? JSON.parse(raw).theme : 'system';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
