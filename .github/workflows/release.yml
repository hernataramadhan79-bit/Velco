name: "Release (All Platforms)"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-AppleSilicon-M-Series'
          - platform: 'macos-14'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-Intel'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            name: 'Windows-x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            name: 'Linux-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Package and Upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.0' }}
          releaseName: 'Velco v__VERSION__'
          releaseBody: |
            ### Velco Production Multi-Platform Release

            Universal installers and packages for all supported platforms:
            - **Windows**: `.msi` and `.exe` installer (Windows 10 / 11 64-bit)
            - **macOS Apple Silicon**: `.dmg` installer for MacBook M1, M2, M3, M4
            - **macOS Intel**: `.dmg` installer for Intel MacBook / iMac
            - **Linux**: `.deb` package and portable `.AppImage` (Ubuntu, Debian, Fedora)

            *Air-Gapped P2P Collaboration &bull; Local SQLite Storage &bull; Dual-Mode Architecture &bull; Industrial Minimalism*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Velco-${{ matrix.name }}-Packages
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/velco.exe
          if-no-files-found: warn
