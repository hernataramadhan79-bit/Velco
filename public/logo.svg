<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- V Left Wing Gradient -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- V Right Wing Gradient -->
    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Center Core / Node Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-opacity="0.75"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Subtle Geometric Grid Lines -->
  <path d="M120 256 H392 M256 120 V392" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Dimensional V Symbol -->
  <!-- Left Arm of V -->
  <path d="M136 148 L224 148 L256 312 L224 376 L136 148 Z" fill="url(#vLeftGrad)"/>
  
  <!-- Right Arm of V -->
  <path d="M376 148 L288 148 L256 312 L288 376 L376 148 Z" fill="url(#vRightGrad)"/>

  <!-- Isometric Intersecting Facet -->
  <polygon points="224,148 288,148 256,312" fill="#1e3a8a" opacity="0.6"/>

  <!-- Cryptographic Focal Diamond (The Vault Node) -->
  <g transform="translate(256, 320)">
    <polygon points="0,-36 32,0 0,36 -32,0" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <polygon points="0,-22 20,0 0,22 -20,0" fill="url(#coreGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Top Accent Horizon Bars -->
  <rect x="180" y="124" width="152" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="126" r="3" fill="#38bdf8"/>
  <circle cx="352" cy="126" r="3" fill="#38bdf8"/>
</svg>