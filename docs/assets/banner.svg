<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="bannerGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="vGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="380" rx="16" fill="url(#bannerBg)"/>
  <rect width="1200" height="380" rx="16" fill="none" stroke="url(#bannerBorder)" stroke-width="1.5"/>

  <!-- Background Ambient Glow -->
  <rect width="1200" height="380" rx="16" fill="url(#bannerGlow)"/>

  <!-- Matrix Dot Pattern -->
  <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.06"/>
  </pattern>
  <rect width="1200" height="380" rx="16" fill="url(#dotPattern)"/>

  <!-- Left Side: Dimensional Logo Emblem -->
  <g transform="translate(80, 70)">
    <!-- Squircle frame -->
    <rect width="240" height="240" rx="54" fill="#0c111c" stroke="#1e293b" stroke-width="2"/>
    <circle cx="120" cy="120" r="85" fill="#3b82f6" fill-opacity="0.12"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- V Symbol -->
    <path d="M60 66 L104 66 L120 152 L104 186 L60 66 Z" fill="url(#vGradLeft)"/>
    <path d="M180 66 L136 66 L120 152 L136 186 L180 66 Z" fill="url(#vGradRight)"/>
    <polygon points="104,66 136,66 120,152" fill="#1e3a8a" opacity="0.6"/>

    <!-- Center Node -->
    <g transform="translate(120, 160)">
      <polygon points="0,-18 16,0 0,18 -16,0" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="0,-11 10,0 0,11 -10,0" fill="#10b981"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Ambient glow dot -->
    <circle cx="120" cy="198" r="3" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Right Side: Brand & Typographic Hierarchy -->
  <g transform="translate(380, 95)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">v0.2.0 PRODUCTION RELEASE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">VELCO</text>

    <!-- Subtitle -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="500" fill="#38bdf8" letter-spacing="0.5">The Local-First Context-Bound AI Workstation</text>

    <!-- Description -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Zero-cloud air-gapped P2P collaboration &bull; Embedded SQLite &bull; Universal binaries for Windows, macOS &amp; Linux
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 172)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="128" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1"> macOS (M + Intel)</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(136, 0)">
        <rect width="112" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1">⊞ Windows x64</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(256, 0)">
        <rect width="134" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1">🐧 Linux (AppImage/deb)</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(398, 0)">
        <rect width="118" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#10b981">● Air-Gapped P2P</text>
      </g>
    </g>
  </g>
</svg>